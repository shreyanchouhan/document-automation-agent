name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate the corpus
        run: python data/generate_corpus.py
      - name: Tests
        run: pytest -q
      - name: Evals (gated on thresholds)
        run: python evals/run_eval.py --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-py${{ matrix.python-version }}
          path: evals/results.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -f deploy/Dockerfile -t document-automation-agent:ci .
