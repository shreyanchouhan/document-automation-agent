apiVersion: apps/v1
kind: Deployment
metadata:
  name: docagent-api
  labels: {app: docagent, component: api}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: docagent, component: api}
  template:
    metadata:
      labels: {app: docagent, component: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/shreyanchouhan/document-automation-agent:latest
          imagePullPolicy: IfNotPresent
          args: ["api"]
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: docagent-config}
            - secretRef: {name: docagent-secrets}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: state, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: docagent-state}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docagent-state
  labels: {app: docagent}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 5Gi}
